[project]
name = "app-review-insights-agent"
version = "0.1.0"
description = "A RAG + LangGraph agent that ingests mobile app store reviews, classifies and analyzes them, and produces insight reports."
requires-python = ">=3.11"
dependencies = [
    # Exact-pinned, not >=: Streamlit Community Cloud resolves fresh on
    # deploy and does not honor uv.lock, so a loose bound here can pull a
    # newer major version than what's actually been tested (this bit us
    # once already — see docs/CASE_STUDY.md). requirements.txt (exported
    # from uv.lock via `uv export`) is the source of truth Streamlit Cloud
    # actually installs from; these pins just keep `pip install .` and
    # plain `uv add` resolution consistent with it.
    "langgraph==1.2.11",
    "langchain==1.3.18",
    "langchain-chroma==1.1.0",
    "chromadb==1.5.9",
    "sentence-transformers==6.0.0",
    "google-play-scraper==1.2.7",
    "pandas==3.0.5",
    "python-dotenv==1.2.3",
    "streamlit==1.62.0",
    "langsmith==0.11.2",
    "langchain-groq==1.1.3",
    "langchain-huggingface==1.2.2",
    "langgraph-checkpoint-sqlite==3.1.1",
    "scikit-learn==1.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app_review_agent"]
