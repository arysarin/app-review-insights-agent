[project]
name = "app-review-insights-agent"
version = "0.1.0"
description = "A RAG + LangGraph agent that ingests mobile app store reviews, classifies and analyzes them, and produces insight reports."
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-chroma>=0.1.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "google-play-scraper>=1.2.7",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.38.0",
    "langsmith>=0.1.0",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "scikit-learn>=1.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app_review_agent"]
